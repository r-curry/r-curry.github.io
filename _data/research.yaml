projects:
  - title: Exploring the shell structure of trapped superfluid gases 
    system-name: 
    image: assets/img/trapped-pairing.png
    journal: 
    journal-web: 
    status:
    authors: Georgios Palkanoglou, Ryan Curry, and Stefano Gandolfi 
    preprint: https://arxiv.org/abs/2607.14214
    abstract-less: We study the behavior of an ultracold Fermi gas confined to a harmonic trap. We find that as pairing effects become more important, the shell effects induced by the trap become negligible, potentially with implications for shell effects in neutron-rich nuclei.  
    abstract-more: 
    ribbon: Preprint
    category: "cold atoms"

  - title: Conformal prediction for uncertainties in the neutron star equation of state
    system-name: 
    image: assets/img/cqr-neutronstar.png
    journal: 
    journal-web: 
    status:
    authors: Habib Yousefi Dezdarani, Ryan Curry, Cassandra L. Armstrong, and Alexandros Gezerlis
    preprint: https://arxiv.org/abs/2604.21039
    abstract-less: We extend previous work on conformalized quantile regression to study the neutron matter equation of state. As applications, we consider a toy-model employing a polytropic EOS, posterior distributions from the NMMA collaboration, as well as emulator samples for auxiliary-field diffusion Monte Carlo calculations of pure neutron matter.  
    abstract-more: 
    ribbon: Preprint
    category: "uq"

  - title: Quantum Monte Carlo Calculations of Light Nuclei with Fully Propagated Theoretical Uncertainties 
    system-name: 
    image: assets/img/emulator.png
    journal: Accepted in Physics Letters B 
    journal-web: 
    status:
    authors: Ryan Curry, Kai Hebeler, Stefano Gandolfi, Alexandros Gezerlis, Achim Schwenk, Rahul Somasundaram, and Ingo Tews  
    preprint: https://arxiv.org/abs/2510.15860
    abstract-less: We develop a framework for the propagation of theoretical uncertainties from the chiral EFT interaction to the level of many-body predictions. We build emulators for solutions to the Faddeev equations as well as auxiliary-field diffusion Monte Carlo, studying nuclei along the helium isotopic chain. 
    abstract-more: 
    ribbon: Phys. Lett. B 
    category: "chiral-eft 3nf uq"

  - title: Ab initio study of the neutron and Fermi polarons on the lattice
    system-name: 
    image: assets/img/polaron.png
    journal: Physical Review C, <b>113</b>, 044002 (2026)
    journal-web: https://journals.aps.org/prc/abstract/10.1103/s24h-lq8f
    status:
    authors: Ryan Curry, Jasmine Kozar, and Alexandros Gezerlis
    preprint: https://arxiv.org/abs/2510.05233
    abstract-less: We apply our lattice quantum Monte Carlo approach to the study of the Fermi and neutron polarons, in order to test how our approach fares for systems with an unfavorable sign problem. We find reasonably good agreement with previous theoretical and experimental studies.  
    abstract-more: 
    ribbon: Phys. Rev. C 
    category: "cold-atoms, lattice"

  - title: Conformal prediction for uncertainties in nucleon-nucleon scattering
    system-name: 
    image: assets/img/cqr-scattering.png
    journal: Physical Review C, <b>113</b>, 014004 (2025)
    journal-web: https://journals.aps.org/prc/abstract/10.1103/2n82-2jvv
    status:
    authors: Habib Yousefi Dezdarani, Ryan Curry, and Alexandros Gezerlis
    preprint: https://arxiv.org/abs/2507.08085
    abstract-less: We explore the application of conformal prediction (and in particular conformalized quantile regression) to construct uncertainty bands with guaranteed coverage for nucleon-nucleon phase shifts.  
    abstract-more: 
    ribbon: Phys. Rev. C 
    category: "uq"
  
  - title: Perturbative treatment of non-local chiral interactions in auxiliary-field diffusion Monte Carlo 
    system-name: 
    image: assets/img/nonlocal-perturb.png
    journal: Physical Review C, <b>111</b>, 015801 (2025)
    journal-web: https://journals.aps.org/prc/abstract/10.1103/PhysRevC.111.015801
    status:
    authors: Ryan Curry, Rahul Somasundaram, Stefano Gandolfi, Alexandros Gezerlis, and Ingo Tews
    preprint: https://arxiv.org/abs/2409.16365
    abstract-less: We extend our previously developed formalism for second-order perturbative corrections in quantum Monte Carlo to handle non-local realistic nuclear interactions. We test our approach for a single operator at next-to-leading order applied to both the deuteron and neutron matter.  
    abstract-more: 
    ribbon: Phys. Rev. C 
    category: "chiral-eft"

  - title: BCS-BEC crossover of the strongly interacting 6Li-40K mixture
    system-name: 
    image: assets/img/heavy-light-crossover.png
    journal: Physical Review A, <b>110</b>, 043320 (2024)
    journal-web: https://journals.aps.org/pra/abstract/10.1103/PhysRevA.110.043320
    status:
    authors: Stefano Gandolfi, Ryan Curry,  and Alexandros Gezerlis
    preprint: https://arxiv.org/abs/2407.12102
    abstract-less: We perform diffusion Monte Carlo (DMC) calculations of a cold-atomic system comprised of heavy and light particles that interact through a central interaction. We are able to study the full BCS-BEC crossover and provide predictions for universal quantities such as the contact parameter and quasi-particle dispersion.  
    abstract-more: 
    ribbon: Phys. Rev. A 
    category: "cold-atoms"


  - title: Auxiliary Field Quantum Monte Carlo for dilute neutrons on the lattice
    system-name: 
    image: assets/img/dilute-neutrons.png
    journal: Philosophical Transactions of the Royal Society A, <b>382</b>, 20230127 (2024)
    journal-web: https://royalsocietypublishing.org/doi/10.1098/rsta.2023.0127
    status:
    authors: Ryan Curry, Jayani Dissanayake, Stefano Gandolfi, and Alexandros Gezerlis
    preprint: https://arxiv.org/abs/2310.01504 
    abstract-less: We begin developing a novel lattice auxiliary-field quantum Monte Carlo approach with the end goal of studying nuclear physics. Here, we focus almost entirely on setting the stage for future work. We benchmark our method against the attractive Hubbard model, and few-body cold-atomic systems, before turning our attention to dilute neutrons.  
    abstract-more: 
    ribbon: Phil. Trans. <br> R. Soc. A
    category: "lattice"


  - title: Second-Order Perturbation Theory in Continuum Quantum Monte Carlo Calculations 
    system-name: 
    image: assets/img/second-order-perturb.png
    journal: Physical Review Research, <b>5</b>, L042021 (2023) 
    journal-web: https://journals.aps.org/prresearch/abstract/10.1103/PhysRevResearch.5.L042021
    status:
    authors: Ryan Curry, Joel E. Lynn, Kevin E. Schmidt, and Alexandros Gezerlis
    preprint: https://arxiv.org/abs/2302.07285 
    abstract-less: We develop the formalism to compute second-order perturbation theory corrections in a quantum Monte Carlo context. We apply the formalism to simple nuclear physics test-cases, before investigating the perturbative convergence of the chiral EFT expansion. Though limited to central s-wave interactions, the formalism is applicable for more realistic nuclear interactions.   
    abstract-more: 
    ribbon: Phys. Rev. Res.
    category: "chiral-eft perturb"


