# about me
first-paragraph: I am postdoctoral researcher in <a href="https://www.lanl.gov/engage/organizations/aldsct/theoretical/nppac" target="_blank" rel="noopener">T-Division (T-2)</a> at Los Alamos National Laboratory. I completed my graduate (and undergraduate) degree in the <a href="https://www.uoguelph.ca/physics" target="_blank" rel="noopener">Physics Department at The University of Guelph</a> in Guelph, ON Canada, under the supervision of Professor <a href="https://www.uoguelph.ca/profile/alexandros-gezerlis" target="_blank" rel="noopener">Alexandros Gezerlis</a>. 
second-paragraph: My research is primarily focused on the quantum Monte Carlo (QMC) family of approaches, as applied to the study of nuclear physics. I work on a number of different QMC methods, both in the continuum and on the lattice. One of my main interests is investigating how our current description of the nuclear force, chiral effective field theory, could be improved in our many-body physics calculations. To this end, I am also involved in uncertainty quantification studies using emulators inspired from machine learning. Currently I am studying these topics by looking at the structure of light nuclei, and the equation of state of neutron matter. 
third-paragraph: Below you can find more information on my recent publications and talks. For anything else, you can find it in my <a href="/assets/doc/curry_CV.pdf" target="_blank" rel="noopener">CV</a>. 
